<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Exia Organics · Natural haircare from Ghana</title>
    <meta name="description" content="Herbal shampoos, conditioners, growth butter and repair oils made in Ghana for natural and textured hair. Order directly on WhatsApp." />
    <meta name="theme-color" content="#241d6e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exia Organics" />
    <meta property="og:title" content="Exia Organics · Natural haircare from Ghana" />
    <meta property="og:description" content="Herbal shampoos, growth butter and repair oils for natural hair. Order on WhatsApp." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">

    <!--
      Splash: inline so it paints before any JS downloads. Shown once per browser
      session; src/splash.js advances the progress line and lifts it away.
      Colours mirror the tokens in src/index.css (indigo-deep, shea, lid).
    -->
    <script>
      try { if (sessionStorage.getItem('exia-splash-seen')) document.documentElement.classList.add('no-splash'); } catch (e) {}
    </script>
    <style>
      .no-splash #splash { display: none; }
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #16123f; color: #f4ece0;
        transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.5s ease;
        /* Failsafe: if the app never boots, get out of the way anyway. */
        animation: splash-failsafe 0.5s ease 6s forwards;
      }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; } }
      #splash.is-leaving { transform: translateY(-100%); }
      #splash .mark { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 0 24px; text-align: center; }
      #splash svg { width: 64px; height: 64px; overflow: visible; }
      #splash svg path {
        fill: none; stroke: #d9a85a; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: splash-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #splash svg path:nth-child(2) { animation-delay: 0.25s; }
      #splash svg path:nth-child(3) { animation-delay: 0.4s; }
      #splash svg path:nth-child(4) { animation-delay: 0.6s; }
      #splash svg path:nth-child(5) { animation-delay: 0.7s; }
      #splash .word {
        margin: 0; font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 3.25rem); font-weight: 600; line-height: 1; letter-spacing: -0.01em;
        opacity: 0; transform: translateY(10px);
        transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash .word em { font-style: italic; color: #d9a85a; }
      #splash .caption {
        margin: 0; font-family: "DM Mono", ui-monospace, Consolas, monospace;
        font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244, 236, 224, 0.7);
        opacity: 0; transition: opacity 0.7s ease 0.2s;
      }
      #splash.fonts-ready .word { opacity: 1; transform: none; }
      #splash.fonts-ready .caption { opacity: 1; }
      #splash .progress {
        position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
        background: #d9a85a; transform-origin: left; transform: scaleX(var(--p, 0.08));
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash .word, #splash .caption, #splash .progress { transition: opacity 0.3s ease; transform: none; }
        #splash svg path { animation: none; stroke-dashoffset: 0; }
        #splash.is-leaving { transform: none; opacity: 0; }
        #splash .progress { transform: scaleX(var(--p, 0.08)); }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Exia Organics">
      <div class="mark">
        <!-- The sprouting leaf from the Exia logo, drawn as a single line. -->
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path pathLength="1" d="M32 60 C32 50 31.5 42 33 30" />
          <path pathLength="1" d="M32.4 40 C21 40 12 31 12 19 C24 19 32.4 28 32.4 40 Z" />
          <path pathLength="1" d="M33 30 C33 17 42 7 54 4 C55 18 46 29 33 30 Z" />
          <path pathLength="1" d="M32.4 40 C27 33 22 27 17 23" />
          <path pathLength="1" d="M33 30 C38 22 44 14 50 9" />
        </svg>
        <p class="word">Exia <em>Organics</em></p>
        <p class="caption">Handcrafted in Ghana</p>
      </div>
      <div class="progress" aria-hidden="true"></div>
    </div>
    <!--
      Netlify Forms registration (never shown). The checkout posts these same
      fields with fetch; Netlify then emails each order to Exia.
    -->
    <form name="order" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="subject" />
      <input name="reference" />
      <input name="customer_name" />
      <input name="customer_phone" />
      <input name="delivery_area" />
      <input name="delivery_address" />
      <textarea name="items"></textarea>
      <input name="total" />
      <input name="momo_transaction_id" />
      <input name="momo_sender" />
      <textarea name="note"></textarea>
      <textarea name="summary"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
